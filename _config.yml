# _config.yml
source: site
destination: _site

# Theme Configuration
remote_theme: just-the-docs/just-the-docs

# Plugins required by Just the Docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Just the Docs settings
title: My Docs Site
description: Documentation built with Just the Docs and GitHub Pages.

exclude:
  - docs/quality_control/
