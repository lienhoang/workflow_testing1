name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Dynamically append the PR subdirectory path into a custom Jekyll config file
      - name: Inject PR Baseurl for Jekyll
        if: github.event.action != 'closed'
        run: |
          echo "baseurl: \"/workflow_testing1/pr-preview/pr-${{ github.event.pull_request.number }}\"" > site/_config_preview.yml

      # 2. Build the Jekyll site using BOTH config files into a new temporary directory
      - name: Build Jekyll Site
        if: github.event.action != 'closed'
        run: |
          bundle exec jekyll build --source site --config site/_config.yml,site/_config_preview.yml --destination dist


      # 3. Tell the action to look inside your site folder, including your new preview config override
      - name: Deploy Preview to GitHub Pages
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
