name: Deploy Site & PR Previews

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write

jobs:
  # JOB 1: Handles Live Production Deployment when pushed to Main
  deploy-production:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 2: Handles Hierarchical Previews for Pull Requests
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # We only build if the PR is being opened/updated, skip if it's being closed
      - name: Build Jekyll Site for Preview
        if: github.event.action != 'closed'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site-preview

      - name: Deploy PR Preview Hierarchy
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site-preview
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: ${{ github.event.action }}
