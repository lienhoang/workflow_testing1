name: Deploy Just the Docs & PR Previews

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Restricts overlapping workflow updates from clashing
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  pull-requests: write
  id-token: write

jobs:
  # JOB 1: Handles Live Production Deployment when pushed to Main
  deploy-production:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
          baseurl: /${{ github.event.repository.name }} 

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # JOB 2: Handles Tiered Previews for Pull Requests
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # CRUCIAL FIX: Force GitHub to checkout the actual latest commit from the PR branch
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build Jekyll Site for Preview
        if: github.event.action != 'closed'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site-preview
          # Injects the specific nested PR path into the styling stylesheets configuration
          baseurl: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}

      - name: Deploy PR Preview Hierarchy
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site-preview
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: ${{ github.event.action }}
