name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Dynamically append the PR subdirectory path into a custom Jekyll config file
      - name: Inject PR Baseurl for Jekyll
        if: github.event.action != 'closed'
        run: |
          echo "baseurl: \"/workflow_testing1/pr-preview/pr-${{ github.event.pull_request.number }}\"" > site/_config_preview.yml

            # 2. Force overwrite the production baseurl to prevent path string compounding
            
      # This strips out the old baseurl line from your _config.yml and writes the new one
      - name: Prepare Preview Configurations
        if: github.event.action != 'closed'
        run: |
          sed -i '/baseurl:/d' site/_config.yml
          cat site/_config.yml site/_config_preview.yml > site/_config_temp.yml
          mv site/_config_temp.yml site/_config.yml
          rm -f site/_config_preview.yml



      # 3. Tell the action to look inside your site folder, including your new preview config override
      - name: Deploy Preview to GitHub Pages
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
